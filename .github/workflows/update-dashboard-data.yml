name: Update dashboard data

on:
  # Tuesday 11:00 UTC (early morning ET) — after Monday Night Football stats
  # settle in nflverse. Runs September–February (the NFL season + playoffs).
  schedule:
    - cron: "0 11 * 1,2,9,10,11,12 2"
  # Manual runs from the Actions tab, any time.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Rebuild dashboard data from nflverse
        run: python pipeline/build_dashboard_data.py --live

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/qb_data.json dashboard/index.html
          if git diff --cached --quiet; then
            echo "No data changes this week."
          else
            git commit -m "Data: weekly dashboard refresh ($(date -u +%Y-%m-%d))"
            git push
          fi
